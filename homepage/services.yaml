# Links open in the browser, so they use HOMEPAGE_HOST and the host ports.
# Status checks and widgets run inside media-net, so they use service names.
- Downloads:
    - qBittorrent:
        icon: qbittorrent.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:{{HOMEPAGE_VAR_QBIT_PORT}}
        siteMonitor: http://qbittorrent:8080
    - Prowlarr:
        icon: prowlarr.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:{{HOMEPAGE_VAR_PROWLARR_PORT}}
        siteMonitor: http://prowlarr:9696/ping
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
    - FlareSolverr:
        icon: flaresolverr.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:{{HOMEPAGE_VAR_FLARESOLVERR_PORT}}
        siteMonitor: http://flaresolverr:8191

- Library:
    - Radarr:
        icon: radarr.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:{{HOMEPAGE_VAR_RADARR_PORT}}
        siteMonitor: http://radarr:7878/ping
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
    - Sonarr:
        icon: sonarr.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:{{HOMEPAGE_VAR_SONARR_PORT}}
        siteMonitor: http://sonarr:8989/ping
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
    - Lidarr:
        icon: lidarr.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:{{HOMEPAGE_VAR_LIDARR_PORT}}
        siteMonitor: http://lidarr:8686/ping
        widget:
          type: lidarr
          url: http://lidarr:8686
          key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"

- Watch:
    - Jellyfin:
        icon: jellyfin.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:{{HOMEPAGE_VAR_JELLYFIN_PORT}}
        siteMonitor: http://jellyfin:8096
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
