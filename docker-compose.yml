# ─────────────────────────────────────────────────────────────────────────────
#  media-stack — self-hosted media ecosystem
#
#  Design principle: every service that moves media shares ONE mount point,
#  ${DATA_ROOT} -> /data, so Sonarr/Radarr/Lidarr can HARDLINK imports instead
#  of copying them. Downloads live in /data/downloads; final libraries live in
#  /data/{movies,tv,music}. Same filesystem = instant, zero-extra-disk imports,
#  and qBittorrent keeps seeding the original files for the tracker.
#
#  Do NOT split this back into separate downloads + media mounts: different
#  mounts = different filesystems inside the container = hardlinks silently fall
#  back to copies (your storage doubles and seeding breaks).
#
#  Storage location is controlled in ONE place via .env:
#    CONFIG_ROOT  (default ./config)  -> per-service app state
#    DATA_ROOT    (default ./data)    -> downloads + media libraries
#  Moving to a dedicated server / external HDD is then a one-line .env change;
#  the in-container paths (/config, /data) never move, so hardlinks are safe.
#
#  Note: the top-level `version:` key is intentionally omitted — it is obsolete
#  in Compose v2. `name:` sets the Compose project name (network prefix, etc.)
#  independently of the folder name.
# ─────────────────────────────────────────────────────────────────────────────

name: media-stack

services:
  # ── Torrent client (the ONLY one — keeps private-tracker ratio sane) ────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: media-stack-qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # WEBUI_PORT is deliberately NOT set here. The container listens on 8080
      # internally; we only remap the HOST port below. Setting WEBUI_PORT would
      # change the *internal* port and break the "${QBIT_WEBUI_PORT}:8080" map.
    volumes:
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config
      - ${DATA_ROOT:-./data}:/data               # save path: /data/downloads
    ports:
      - "${QBIT_WEBUI_PORT:-8080}:8080"          # WebUI
      - "${QBIT_TORRENT_PORT:-6881}:6881"        # BitTorrent (TCP)
      - "${QBIT_TORRENT_PORT:-6881}:6881/udp"    # BitTorrent (UDP/DHT)
    restart: unless-stopped
    networks: [media-net]

  # ── Indexer manager: one place to configure all trackers ────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: media-stack-prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    restart: unless-stopped
    networks: [media-net]

  # ── TV automation ───────────────────────────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: media-stack-sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      - ${DATA_ROOT:-./data}:/data               # root folder: /data/tv
    ports:
      - "${SONARR_PORT:-8989}:8989"
    restart: unless-stopped
    networks: [media-net]

  # ── Movie automation ────────────────────────────────────────────────────────
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: media-stack-radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT:-./config}/radarr:/config
      - ${DATA_ROOT:-./data}:/data               # root folder: /data/movies
    ports:
      - "${RADARR_PORT:-7878}:7878"
    restart: unless-stopped
    networks: [media-net]

  # ── Music automation ────────────────────────────────────────────────────────
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: media-stack-lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT:-./config}/lidarr:/config
      - ${DATA_ROOT:-./data}:/data               # root folder: /data/music
    ports:
      - "${LIDARR_PORT:-8686}:8686"
    restart: unless-stopped
    networks: [media-net]

  # ── Media server (Netflix-style frontend) ───────────────────────────────────
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: media-stack-jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyfin:/config
      - ${DATA_ROOT:-./data}:/data               # libraries: /data/{movies,tv,music}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    restart: unless-stopped
    networks: [media-net]

  # ── Cloudflare solver for protected public indexers (used by Prowlarr) ───────
  #  Not an LSIO image, so it takes no PUID/PGID. Prowlarr reaches it in-network
  #  at http://flaresolverr:8191 (Settings ▸ Indexer Proxies).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: media-stack-flaresolverr
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - TZ=${TZ}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    restart: unless-stopped
    networks: [media-net]

  # ── Landing page: one URL with a live tile for every service ──────────────────
  #  Not an LSIO image. Its config is the committed ./homepage folder, mounted
  #  read-only; API keys and the host for links come in as HOMEPAGE_VAR_* and
  #  fill {{...}} in the YAML. It keeps no runtime state.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: media-stack-homepage
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # The default file log needs a writable /app/config; send it to `docker logs`.
      - LOG_TARGETS=stdout
      # Homepage rejects requests whose Host header is not listed here.
      - HOMEPAGE_ALLOWED_HOSTS=localhost:${HOMEPAGE_PORT:-3000},${HOMEPAGE_HOST:-localhost}:${HOMEPAGE_PORT:-3000}
      - HOMEPAGE_VAR_HOST=${HOMEPAGE_HOST:-localhost}
      - HOMEPAGE_VAR_QBIT_PORT=${QBIT_WEBUI_PORT:-8080}
      - HOMEPAGE_VAR_PROWLARR_PORT=${PROWLARR_PORT:-9696}
      - HOMEPAGE_VAR_FLARESOLVERR_PORT=${FLARESOLVERR_PORT:-8191}
      - HOMEPAGE_VAR_RADARR_PORT=${RADARR_PORT:-7878}
      - HOMEPAGE_VAR_SONARR_PORT=${SONARR_PORT:-8989}
      - HOMEPAGE_VAR_LIDARR_PORT=${LIDARR_PORT:-8686}
      - HOMEPAGE_VAR_JELLYFIN_PORT=${JELLYFIN_PORT:-8096}
      - HOMEPAGE_VAR_PROWLARR_KEY=${PROWLARR_API_KEY:-}
      - HOMEPAGE_VAR_RADARR_KEY=${RADARR_API_KEY:-}
      - HOMEPAGE_VAR_SONARR_KEY=${SONARR_API_KEY:-}
      - HOMEPAGE_VAR_LIDARR_KEY=${LIDARR_API_KEY:-}
      - HOMEPAGE_VAR_JELLYFIN_KEY=${JELLYFIN_API_KEY:-}
    volumes:
      - ./homepage:/app/config:ro
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"
    restart: unless-stopped
    networks: [media-net]

  # ── TRaSH-guide quality profiles as code (run on demand, never at `up`) ───────
  #  The image's default mode is a daily cron sync that rewrites live profiles,
  #  so it sits behind a profile and runs only as `docker compose run --rm recyclarr …`.
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: media-stack-recyclarr
    profiles: [tools]
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
    volumes:
      # Docker would create a missing folder as root, which ${PUID} can't write;
      # fail fast instead (see README: mkdir it first).
      - type: bind
        source: ${CONFIG_ROOT:-./config}/recyclarr
        target: /config
        bind:
          create_host_path: false
      - ./recyclarr:/config/configs:ro           # the committed recyclarr.yml
    networks: [media-net]

networks:
  media-net:
    driver: bridge
