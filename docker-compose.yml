services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBIT_WEBUI_PORT}
    volumes:
      - ./config-qbittorrent:/config
      - ./downloads:/downloads
    ports:
      - "${QBIT_WEBUI_PORT}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - media-net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config-prowlarr:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    restart: unless-stopped
    networks:
      - media-net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config-sonarr:/config
      - ./media/tv:/tv
      - ./downloads:/downloads
    ports:
      - "${SONARR_PORT}:8989"
    restart: unless-stopped
    networks:
      - media-net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config-radarr:/config
      - ./media/movies:/movies
      - ./downloads:/downloads
    ports:
      - "${RADARR_PORT}:7878"
    restart: unless-stopped
    networks:
      - media-net

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config-lidarr:/config
      - ./media/music:/music
      - ./downloads:/downloads
    ports:
      - "${LIDARR_PORT}:8686"
    restart: unless-stopped
    networks:
      - media-net

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config-jellyfin:/config
      - ./media/movies:/media/movies
      - ./media/tv:/media/tv
      - ./media/music:/media/music
    ports:
      - "${JELLYFIN_PORT}:8096"
    restart: unless-stopped
    networks:
      - media-net

networks:
  media-net:
    driver: bridge
