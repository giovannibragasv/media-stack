# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# TRaSH Guides quality profiles and custom formats, synced into Radarr and Sonarr.
# Generated from the official `hd-bluray-web` and `web-1080p` templates
# (`recyclarr config create -t <name>`); see that output for the optional groups.
#
# Preview: docker compose run --rm recyclarr sync --preview
# Apply:   docker compose run --rm recyclarr sync

radarr:
  hd-bluray-web:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats

    # Never grab a dubbed release. "Not Original" catches audio without the film's
    # original language (a Portuguese-language film stays allowed); "Dubs Only"
    # catches titles tagged DUB/DUBBED that carry no language info.
    custom_formats:
      - trash_ids:
          - d6e9318c875905d6cfb5bee961afcea9  # Language: Not Original
          - b23eae459cc960816f2d6ba84af45055  # Dubs Only
        assign_scores_to:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
            score: -10000

sonarr:
  web-1080p:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats

    # Never grab a dubbed release; same rule as Radarr above.
    custom_formats:
      - trash_ids:
          - ae575f95ab639ba5d15f663bf019e3e8  # Language: Not Original
          - 9c14d194486c4014d422adc64092d794  # Dubs Only
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            score: -10000
